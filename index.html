<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex,nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HalıSaha AI - Yönetici Paneli</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: {
                        brand: {
                            red: '#f43f5e',
                            orange: '#f97316',
                            bg: '#030303',
                            panel: 'rgba(10, 10, 10, 0.6)'
                        },
                        pitch: {
                            DEFAULT: '#10b981',
                            dark: '#047857',
                            lines: 'rgba(255, 255, 255, 0.4)'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #030303; color: #ffffff; overflow-x: hidden; }
        .glass-panel { background: rgba(30, 41, 59, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .pitch-bg { background: linear-gradient(to bottom, #065f46, #047857); position: relative; box-shadow: inset 0 0 100px rgba(0,0,0,0.6); }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
</head>
<body class="min-h-screen flex flex-col pb-16 antialiased selection:bg-rose-500 selection:text-white">

<div id="login-gate" class="fixed inset-0 z-[200] bg-slate-950 flex items-center justify-center p-4">
    <div class="glass-panel w-full max-w-sm rounded-2xl border border-slate-700 p-6 space-y-4">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center text-slate-900 font-black text-xl"><i class="fa-solid fa-futbol"></i></div>
            <div>
                <h1 class="font-black text-lg text-white leading-tight">Yönetici Girişi</h1>
                <p class="text-[11px] text-slate-400">HalıSaha AI yönetim paneli</p>
            </div>
        </div>
        <div class="space-y-3">
            <button type="button" id="google-login-btn" onclick="adminLogin()" class="w-full bg-white hover:bg-slate-100 text-slate-900 font-bold py-2.5 rounded-xl text-sm transition-all flex items-center justify-center gap-2">
                <i class="fa-brands fa-google text-red-500"></i> Google ile Giriş Yap
            </button>
            <p id="login-error" class="text-xs text-red-400 min-h-[1rem]"></p>
        </div>
    </div>
</div>

<header class="sticky top-0 z-40 glass-panel border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="switchTab('dashboard')">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center text-slate-900 font-black text-xl shadow-lg">
                    <i class="fa-solid fa-futbol"></i>
                </div>
                <div>
                    <span class="font-black text-lg tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-emerald-400 to-teal-200">HalıSaha AI</span>
                    <span class="text-[10px] block text-slate-400 font-semibold tracking-wider uppercase">Admin Paneli</span>
                </div>
            </div>
            <nav class="hidden md:flex items-center space-x-1">
                <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-btn px-3 py-2 rounded-lg text-xs font-semibold text-emerald-400 bg-slate-800"><i class="fa-solid fa-chart-pie"></i> Genel Bakış</button>
                <button onclick="switchTab('players')" id="nav-players" class="nav-btn px-3 py-2 rounded-lg text-xs font-semibold text-slate-300 hover:bg-slate-800"><i class="fa-solid fa-users-gear"></i> Oyuncular</button>
                <button onclick="switchTab('squad')" id="nav-squad" class="nav-btn px-3 py-2 rounded-lg text-xs font-semibold text-slate-300 hover:bg-slate-800"><i class="fa-solid fa-clipboard-user"></i> Haftalık Kadro</button>
                <button onclick="switchTab('admin')" id="nav-admin" class="nav-btn px-3 py-2 rounded-lg text-xs font-semibold text-slate-300 hover:bg-slate-800"><i class="fa-solid fa-clipboard-list"></i> Maç Kaydı</button>
            </nav>
            <div class="flex items-center space-x-2">
                <button onclick="copyVoteLink()" class="bg-slate-800 hover:bg-slate-700 text-emerald-300 font-bold text-xs px-3 py-2 rounded-xl border border-slate-700"><i class="fa-solid fa-link"></i> Oylama Linki</button>
                <button onclick="adminLogout()" class="bg-slate-800 hover:bg-red-600 text-slate-300 hover:text-white text-xs px-3 py-2 rounded-xl border border-slate-700"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
        </div>
    </div>
</header>

<main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <section id="tab-dashboard" class="tab-content space-y-6">
        <div class="glass-panel rounded-2xl p-5 border border-slate-700/60">
            <h2 class="text-lg font-bold text-white mb-4"><i class="fa-solid fa-ranking-star text-amber-400"></i> Oyuncu Liderlik ve Gerçek Rating Tablosu (ID Bazlı Hesaplama)</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead>
                        <tr class="text-slate-400 border-b border-slate-700/60 text-xs font-semibold uppercase">
                            <th class="pb-3 px-2">#</th>
                            <th class="pb-3 px-2">Oyuncu</th>
                            <th class="pb-3 px-2">Pozisyon</th>
                            <th class="pb-3 px-2 text-center">Oylama Ort.</th>
                            <th class="pb-3 px-2 text-right">Gerçek Rating</th>
                        </tr>
                    </thead>
                    <tbody id="player-leaderboard-body" class="divide-y divide-slate-800"></tbody>
                </table>
            </div>
        </div>
    </section>

    <section id="tab-players" class="tab-content hidden space-y-6">
        <div class="glass-panel p-6 rounded-2xl border border-slate-700">
            <h2 class="text-lg font-bold text-white mb-4"><i class="fa-solid fa-users text-emerald-400"></i> Kayıtlı Oyuncular</h2>
            <div id="players-card-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
        </div>
    </section>

    <section id="tab-squad" class="tab-content hidden space-y-6">
        <div class="glass-panel p-6 rounded-2xl border border-slate-700 space-y-5">
            <h2 class="text-xl font-extrabold text-white"><i class="fa-solid fa-clipboard-user text-emerald-400"></i> Haftalık Kadro & Rating Turu</h2>
            <button onclick="startRatingRound()" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-extrabold text-xs px-4 py-2.5 rounded-xl"><i class="fa-solid fa-play"></i> Yeni Rating Turu Başlat</button>
        </div>
    </section>

    <section id="tab-admin" class="tab-content hidden space-y-6">
        <div class="glass-panel p-6 rounded-2xl border border-slate-700">
            <h2 class="text-xl font-black text-white">Maç Kaydı</h2>
        </div>
    </section>
</main>

<div id="toast-msg" class="fixed bottom-16 right-5 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-800 border border-emerald-500 text-white px-5 py-3 rounded-xl shadow-2xl z-50">
    <span id="toast-text">İşlem yapıldı.</span>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBC5anWNILz9VPS_ktAroINLf8W8MRNL7s",
        authDomain: "halisahaai.firebaseapp.com",
        databaseURL: "https://halisahaai-default-rtdb.firebaseio.com",
        projectId: "halisahaai",
        storageBucket: "halisahaai.firebasestorage.app",
        messagingSenderId: "752014826496",
        appId: "1:752014826496:web:925ed3ae6aa466b178cce5"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let players = [];
    let matches = [];
    let ratingRound = { open: false, roundId: 0 };
    let currentTabId = 'dashboard';
    const ATTR_KEYS = ['pace', 'shooting', 'passing', 'dribbling', 'defending', 'physical'];

    function esc(v) { return String(v ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch])); }
    function showToast(text) {
        const toast = document.getElementById('toast-msg');
        document.getElementById('toast-text').textContent = text;
        toast.classList.remove('translate-y-20', 'opacity-0');
        setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 3000);
    }

    // YENİ GÜÇLENDİRİLMİŞ ID BAZLI RATING HESAPLAMA MANTIĞI
    function getVoteStats(player) {
        // peerAttributeVotes dizisi içindeki her kayıt doğrudan targetId veya hedef ID eşleşmesine bakar.
        // Sonradan eklenen oyuncuların oyları targetId bazlı toplandığı için 70'te takılı kalmaz.
        const votes = (player.peerAttributeVotes || []).filter(v => v && ATTR_KEYS.some(k => typeof v[k] === 'number'));

        if (votes.length === 0) {
            return { count: 0, overall: 70, attrs: { pace: 70, shooting: 70, passing: 70, dribbling: 70, defending: 70, physical: 70 } };
        }

        const attrs = {};
        ATTR_KEYS.forEach(k => {
            const validVals = votes.map(v => v[k]).filter(n => typeof n === 'number');
            attrs[k] = validVals.length ? Math.round(validVals.reduce((a, b) => a + b, 0) / validVals.length) : 70;
        });

        const overall = Math.round(ATTR_KEYS.reduce((s, k) => s + attrs[k], 0) / ATTR_KEYS.length);
        return { count: votes.length, overall, attrs };
    }

    function calculateTrueRating(player) {
        const vs = getVoteStats(player);
        const base = vs.overall;
        const adj = Number.isFinite(player.ratingAdjust) ? player.ratingAdjust : 0;
        return { trueRating: Math.max(1, Math.min(base + adj, 99)), voteAvg: vs.overall, voteCount: vs.count, adjust: adj };
    }

    function renderDashboard() {
        const tbody = document.getElementById('player-leaderboard-body');
        tbody.innerHTML = '';
        const sorted = [...players].sort((a, b) => calculateTrueRating(b).trueRating - calculateTrueRating(a).trueRating);

        sorted.forEach((player, index) => {
            const trStats = calculateTrueRating(player);
            const tr = document.createElement('tr');
            tr.className = 'hover:bg-slate-800/50 transition-colors';
            tr.innerHTML = `
                <td class="py-3 px-2 font-bold text-slate-500 text-xs">${index + 1}</td>
                <td class="py-3 px-2 font-bold text-white text-xs">${esc(player.name)}</td>
                <td class="py-3 px-2"><span class="text-[10px] font-semibold px-2 py-0.5 rounded bg-slate-800 text-emerald-400">${esc(player.position)}</span></td>
                <td class="py-3 px-2 text-center text-xs"><span class="text-amber-400 font-bold">${trStats.voteCount ? trStats.voteAvg : '70'}</span></td>
                <td class="py-3 px-2 text-right font-black text-emerald-400 text-sm">${trStats.trueRating}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function switchTab(tabId) {
        currentTabId = tabId;
        document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
        document.getElementById(`tab-${tabId}`).classList.remove('hidden');
        if (tabId === 'dashboard') renderDashboard();
    }

    async function startRatingRound() {
        try {
            const now = Date.now();
            await db.collection('settings').doc('rating_round').set({ open: true, roundId: now, openedAt: now });
            showToast("Yeni rating turu başlatıldı.");
        } catch (err) {
            showToast("Hata: " + err.message);
        }
    }

    function initFirestoreListeners() {
        db.collection('players').onSnapshot(snap => {
            players = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            renderDashboard();
        });
        db.collection('settings').doc('rating_round').onSnapshot(doc => {
            const d = doc.exists ? doc.data() : {};
            ratingRound = { open: !!d.open, roundId: d.roundId || 0 };
        });
    }

    async function adminLogin() {
        const provider = new firebase.auth.GoogleAuthProvider();
        try { await firebase.auth().signInWithPopup(provider); } catch (e) { showToast("Giriş hatası"); }
    }

    function adminLogout() {
        firebase.auth().signOut().then(() => location.reload());
    }

    function copyVoteLink() {
        const url = new URL('oylama.html', location.href).href;
        navigator.clipboard?.writeText(url).then(() => showToast('Oylama linki kopyalandı!'));
    }

    window.onload = function() {
        firebase.auth().onAuthStateChanged(user => {
            if (user) {
                document.getElementById('login-gate').classList.add('hidden');
                initFirestoreListeners();
            } else {
                document.getElementById('login-gate').classList.remove('hidden');
            }
        });
    };
</script>
</body>
</html>
